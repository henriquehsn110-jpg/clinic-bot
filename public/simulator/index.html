<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador WhatsApp Web — ClinicaBot SaaS Pro</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --wa-green: #00a884;
            --wa-green-hover: #008f6f;
            --wa-teal: #075e54;
            --wa-bg: #efeae2;
            --wa-header-bg: #f0f2f5;
            --wa-msg-in: #ffffff;
            --wa-msg-out: #d9fdd3;
            --wa-blue-tick: #53bdeb;
            --text-main: #111b21;
            --text-muted: #667781;
            --text-subtle: #8696a0;
            --font-wa: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-wa);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #111b21;
            background-image: linear-gradient(180deg, #00a884 0%, #00a884 127px, #111b21 127px, #111b21 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
        }

        /* Container WhatsApp Web */
        .web-container {
            width: 100%;
            max-width: 1200px;
            height: 94vh;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.26);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar com lista de conversas */
        .sidebar {
            width: 380px;
            background: #ffffff;
            border-right: 1px solid #e9edef;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            height: 60px;
            background: var(--wa-header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e9edef;
        }

        .avatar-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00a884;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .search-bar {
            padding: 8px 12px;
            background: #ffffff;
            border-bottom: 1px solid #e9edef;
        }

        .search-input-wrapper {
            background: #f0f2f5;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-input-wrapper input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f2f5;
            transition: background 0.2s;
        }

        .chat-item:hover, .chat-item.active {
            background: #f0f2f5;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .chat-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 15px;
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chat-preview {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
        }

        /* Área de Chat Principal */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--wa-bg);
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86edd832-73b2-11e7-85f5-f041b186d08a.png');
            position: relative;
        }

        .chat-header {
            height: 60px;
            background: var(--wa-header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e9edef;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title {
            font-weight: 600;
            color: var(--text-main);
            font-size: 16px;
        }

        .header-status {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Corpo do Chat / Mensagens */
        .chat-messages {
            flex: 1;
            padding: 20px 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 7.5px;
            font-size: 14px;
            line-height: 19px;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(11,20,26,0.13);
            word-wrap: break-word;
        }

        .message-bubble.incoming {
            background: var(--wa-msg-in);
            align-self: flex-start;
            border-top-left-radius: 0;
            color: var(--text-main);
        }

        .message-bubble.outgoing {
            background: var(--wa-msg-out);
            align-self: flex-end;
            border-top-right-radius: 0;
            color: var(--text-main);
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-subtle);
            float: right;
            margin-left: 12px;
            margin-top: 4px;
        }

        /* Botões / Componentes Interativos do WhatsApp */
        .wa-btn-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 8px;
        }

        .wa-button {
            background: #ffffff;
            border: 1px solid #e9edef;
            color: #00a884;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }

        .wa-button:hover {
            background: #f0f2f5;
        }

        /* Footer / Input de Mensagem */
        .chat-footer {
            min-height: 62px;
            background: var(--wa-header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;
            background: #ffffff;
            border-radius: 8px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
        }

        .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00a884;
            color: white;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .btn-send:hover {
            background: var(--wa-green-hover);
        }

        /* Widget de Seleção de Data/Hora no Simulador */
        .calendar-widget {
            background: #ffffff;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .calendar-widget input[type="date"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            margin-bottom: 8px;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .slot-pill {
            background: #f0f2f5;
            border: 1px solid #00a884;
            color: #00a884;
            padding: 6px;
            text-align: center;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .slot-pill:hover {
            background: #00a884;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="web-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="avatar-circle">IA</div>
                <div style="font-weight: 600; font-size: 14px;">Simulador ClinicaBot</div>
                <i class="fa-solid fa-ellipsis-vertical" style="color: var(--text-muted); cursor: pointer;"></i>
            </div>

            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                    <input type="text" placeholder="Pesquisar ou começar nova conversa">
                </div>
            </div>

            <div class="chats-list">
                <div class="chat-item active">
                    <div class="avatar-circle" style="background: #075e54;">🦷</div>
                    <div class="chat-info">
                        <div class="chat-name-row">
                            <span class="chat-name">Clínica Modelo (WhatsApp)</span>
                            <span class="chat-time" id="chat-time-now">Agora</span>
                        </div>
                        <div class="chat-preview" id="chat-last-preview">Olá! Sou a Ana, assistente virtual...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Main Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="header-left">
                    <div class="avatar-circle" style="background: #075e54;">🦷</div>
                    <div>
                        <div class="header-title">Clínica Modelo Odontológica</div>
                        <div class="header-status" id="header-status-text">online (Atendimento Virtual por IA)</div>
                    </div>
                </div>
                <div>
                    <i class="fa-solid fa-video" style="color: var(--text-muted); margin-right: 16px; cursor: pointer;"></i>
                    <i class="fa-solid fa-phone" style="color: var(--text-muted); margin-right: 16px; cursor: pointer;"></i>
                    <i class="fa-solid fa-ellipsis-vertical" style="color: var(--text-muted); cursor: pointer;"></i>
                </div>
            </div>

            <!-- Lista de Mensagens do Chat -->
            <div class="chat-messages" id="chat-messages">
                <div class="message-bubble incoming">
                    Olá! Sou a Ana, assistente virtual da Clínica Modelo. Como posso te ajudar hoje? 😊
                    <span class="msg-time">08:00</span>
                    <div class="wa-btn-container">
                        <button class="wa-button" onclick="sendQuickMessage('Agendar Consulta')">📅 Agendar Consulta</button>
                        <button class="wa-button" onclick="sendQuickMessage('Remarcar/Cancelar')">🔄 Remarcar/Cancelar</button>
                        <button class="wa-button" onclick="sendQuickMessage('Outras Dúvidas')">❓ Outras Dúvidas</button>
                    </div>
                </div>
            </div>

            <!-- Footer / Input -->
            <div class="chat-footer">
                <i class="fa-regular fa-face-smile" style="font-size: 22px; color: var(--text-muted); cursor: pointer;"></i>
                <i class="fa-solid fa-paperclip" style="font-size: 20px; color: var(--text-muted); cursor: pointer;"></i>
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Digite uma mensagem..." onkeydown="handleKeyPress(event)">
                </div>
                <button class="btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
            ? '/api/webhook'
            : 'http://localhost:3000/api/webhook';

        const TEST_PHONE = '5511999998888';
        const CLINIC_ID = 'e8f24abe-381d-499d-9596-252507b32194';

        function getTimeStr() {
            return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        document.getElementById('chat-time-now').innerText = getTimeStr();

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function sendQuickMessage(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            // Adiciona mensagem enviada do paciente na interface
            appendMessage(text, 'outgoing');

            try {
                // Envia para a API local do Webhook
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-simulator': 'true'
                    },
                    body: JSON.stringify({
                        object: 'whatsapp_business_account',
                        entry: [{
                            id: 'ENTRY_ID',
                            changes: [{
                                value: {
                                    messaging_product: 'whatsapp',
                                    metadata: { display_phone_number: '5511999998888', phone_number_id: '1240708369119720' },
                                    contacts: [{ profile: { name: 'Paciente Simulador' }, wa_id: TEST_PHONE }],
                                    messages: [{
                                        from: TEST_PHONE,
                                        id: 'wamid.' + Date.now(),
                                        timestamp: Math.floor(Date.now() / 1000).toString(),
                                        text: { body: text },
                                        type: 'text'
                                    }]
                                },
                                field: 'messages'
                            }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.responses && data.responses.length > 0) {
                    data.responses.forEach(resp => renderBotResponse(resp));
                }
            } catch (err) {
                console.error('Erro na chamada do simulador:', err);
                appendMessage('⚠️ Erro de conexão com o servidor local do ClinicaBot.', 'incoming');
            }
        }

        function appendMessage(text, type) {
            const container = document.getElementById('chat-messages');
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${type}`;
            bubble.innerHTML = `${text.replace(/\n/g, '<br>')}<span class="msg-time">${getTimeStr()}</span>`;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
            document.getElementById('chat-last-preview').innerText = text;
        }

        function renderBotResponse(resp) {
            const container = document.getElementById('chat-messages');
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble incoming';

            let contentHTML = resp.text ? resp.text.replace(/\n/g, '<br>') : '';

            // Se o bot retornou botões
            if (resp.buttons && resp.buttons.length > 0) {
                contentHTML += '<div class="wa-btn-container">';
                resp.buttons.forEach(bText => {
                    contentHTML += `<button class="wa-button" onclick="sendQuickMessage('${bText}')">${bText}</button>`;
                });
                contentHTML += '</div>';
            }

            // Se o bot retornou lista de procedimentos
            if (resp.showProceduresList && resp.procedures) {
                contentHTML += '<div class="wa-btn-container">';
                resp.procedures.forEach(proc => {
                    contentHTML += `<button class="wa-button" onclick="sendQuickMessage('${proc}')">${proc}</button>`;
                });
                contentHTML += '</div>';
            }

            // Se o bot pediu exibição de calendário visual
            if (resp.showCalendar) {
                const todayIso = new Date().toISOString().split('T')[0];
                contentHTML += `
                    <div class="calendar-widget">
                        <label style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Selecione a data no calendário:</label>
                        <input type="date" min="${todayIso}" id="cal-picker" onchange="onDateSelected(this.value)">
                    </div>`;
            }

            // Se o bot retornou horários disponíveis
            if (resp.showTimeSlots && resp.availableSlots) {
                contentHTML += '<div class="calendar-widget"><div class="slots-grid">';
                resp.availableSlots.forEach(slot => {
                    contentHTML += `<div class="slot-pill" onclick="sendQuickMessage('${slot}')">${slot}</div>`;
                });
                contentHTML += '</div></div>';
            }

            bubble.innerHTML = `${contentHTML}<span class="msg-time">${getTimeStr()}</span>`;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        function onDateSelected(dateVal) {
            if (dateVal) {
                sendQuickMessage(`Selecionei a data: ${dateVal}`);
            }
        }
    </script>
</body>
</html>
