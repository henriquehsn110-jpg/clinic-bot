name: 🌙 Nightly QA Test Suite (ClinicaBot Staging)

on:
  schedule:
    # Rodar diariamente às 00:00 BRT (03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  nightly-test-suite:
    name: Run Nightly Suite against Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Instalar Dependências do Backend
        run: npm ci

      - name: Executar Suíte Noturna (Staging)
        env:
          PORT: 3000
          NODE_ENV: staging
          SUPABASE_URL: https://eywcovvwgccslqfnxaws.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_KEY }}
          WHATSAPP_TOKEN: EAAY_STAGING_TEST_TOKEN
          WHATSAPP_PHONE_ID: 999888777
          VERIFY_TOKEN: clinica_bot_seguro_2026
          APP_SECRET: sua_chave_secreta_da_meta_aqui
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CPF_ENCRYPTION_KEY: 1cd66335394b12caf8fdc562c9d1e1117aeab545b3b1dea77cfe10125ca28a63
          DOTENV_CONFIG_PATH: .env.staging
        run: node -r dotenv/config tests/run_night_suite.js

      - name: Salvar Artefato de Logs da Suíte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-logs-${{ github.run_id }}
          path: logs/
