name: ClinicaBot SaaS Pro — CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Automated Test Battery & Security Preflight
    runs-on: ubuntu-latest
    env:
      HAS_STAGING_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_KEY }}
      HAS_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Run HMAC Webhook Security Preflight (Standalone)
        run: node tests/test_hmac_webhook_injection.js
        env:
          NODE_ENV: test
          APP_SECRET: ${{ secrets.APP_SECRET }}

      - name: 🔍 Run Static QA & Code Integrity Preflight
        run: node scripts/qa_static.js

      - name: ⚙️ Prepare Staging Environment
        if: env.HAS_STAGING_KEY != '' || env.HAS_SERVICE_KEY != ''
        run: |
          cat << 'EOF' > .env.staging
          PORT=3000
          NODE_ENV=staging
          SUPABASE_URL=https://eywcowvwgccslqfnxaws.supabase.co
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_STAGING_SERVICE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          WHATSAPP_TOKEN=EAAY_STAGING_TEST_TOKEN
          WHATSAPP_PHONE_ID=999888777
          VERIFY_TOKEN=clinica_bot_seguro_2026
          APP_SECRET=${{ secrets.APP_SECRET }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CPF_ENCRYPTION_KEY=${{ secrets.CPF_ENCRYPTION_KEY }}
          DOTENV_CONFIG_PATH=.env.staging
          EOF
          cp .env.staging .env

      - name: 🌙 Run Full Integration Test Suite (Staging)
        if: env.HAS_STAGING_KEY != '' || env.HAS_SERVICE_KEY != ''
        env:
          DOTENV_CONFIG_PATH: .env.staging
        run: node -r dotenv/config tests/run_night_suite.js

  deploy-production:
    name: 🚀 Production Deploy Notification
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Report Successful CI Pipeline
        run: echo "CI/CD Pipeline aprovada com 100% dos testes. O ambiente de produção no Render executará o deploy com segurança."
