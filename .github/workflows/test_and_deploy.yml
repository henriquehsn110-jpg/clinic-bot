name: ClinicaBot SaaS Pro — CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Automated Test Battery & Security Preflight
    runs-on: ubuntu-latest
    env:
      HAS_STAGING_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_KEY }}
      HAS_STAGING_APP_SECRET: ${{ secrets.STAGING_APP_SECRET }}
      HAS_STAGING_GEMINI_KEY: ${{ secrets.STAGING_GEMINI_API_KEY }}
      HAS_STAGING_CPF_KEY: ${{ secrets.STAGING_CPF_ENCRYPTION_KEY }}
      HAS_STAGING_VERIFY_TOKEN: ${{ secrets.STAGING_VERIFY_TOKEN }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚨 Enforce Fail-Closed Staging Credentials
        shell: bash
        run: |
          missing=0
          [ -z "$HAS_STAGING_KEY" ] && echo "::error::SUPABASE_STAGING_SERVICE_KEY ausente" && missing=1
          [ -z "$HAS_STAGING_APP_SECRET" ] && echo "::error::STAGING_APP_SECRET ausente" && missing=1
          [ -z "$HAS_STAGING_GEMINI_KEY" ] && echo "::error::STAGING_GEMINI_API_KEY ausente" && missing=1
          [ -z "$HAS_STAGING_CPF_KEY" ] && echo "::error::STAGING_CPF_ENCRYPTION_KEY ausente" && missing=1
          [ -z "$HAS_STAGING_VERIFY_TOKEN" ] && echo "::error::STAGING_VERIFY_TOKEN ausente" && missing=1
          if [ "$missing" -ne 0 ]; then
            echo "::error::CI abortado fail-closed: secrets exclusivos de staging são obrigatórios."
            exit 1
          fi

      - name: 🛡️ Run HMAC Webhook Security Preflight (Standalone)
        run: node tests/test_hmac_webhook_injection.js
        env:
          NODE_ENV: test
          APP_SECRET: ${{ secrets.STAGING_APP_SECRET }}

      - name: 🔍 Run Static QA & Code Integrity Preflight
        run: node scripts/qa_static.js

      - name: ⚙️ Prepare Staging Environment
        run: |
          cat << 'EOF' > .env.staging
          PORT=3000
          NODE_ENV=staging
          SUPABASE_URL=https://eywcowvwgccslqfnxaws.supabase.co
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_STAGING_SERVICE_KEY }}
          WHATSAPP_PHONE_ID=999888777
          DISABLE_EXTERNAL_WHATSAPP=true
          VERIFY_TOKEN=${{ secrets.STAGING_VERIFY_TOKEN }}
          APP_SECRET=${{ secrets.STAGING_APP_SECRET }}
          GEMINI_API_KEY=${{ secrets.STAGING_GEMINI_API_KEY }}
          CPF_ENCRYPTION_KEY=${{ secrets.STAGING_CPF_ENCRYPTION_KEY }}
          DOTENV_CONFIG_PATH=.env.staging
          EOF

      - name: 🌙 Run Full Integration Test Suite (Staging)
        env:
          DOTENV_CONFIG_PATH: .env.staging
          DISABLE_EXTERNAL_WHATSAPP: 'true'
        run: node -r dotenv/config tests/run_night_suite.js

  deploy-production:
    name: 🚀 Production Deploy Notification
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Report Successful CI Pipeline
        run: echo "CI/CD Pipeline aprovada com 100% dos testes. O ambiente de produção no Render executará o deploy com segurança."
